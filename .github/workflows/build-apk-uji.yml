# APK Run Now untuk fork pribadi. Dijalankan manual dari tab Actions.
# Ditandatangani keystore milikku sendiri: signing/runnow.jks.enc, dibuka dengan secret KEYSTORE_PASSPHRASE.
name: Build APK uji

on:
  workflow_dispatch:
    inputs:
      minify:
        description: "Kecilkan kode dan resource (R8). Matikan kalau aplikasi error setelah dipasang."
        type: boolean
        default: true
      legacy_packaging:
        description: "Kompres pustaka native di dalam APK. File APK lebih kecil, tapi ukuran terpasang di HP lebih besar."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JOYOFIT_DISTRIBUTION: sideload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/.cache "$AGENT_TOOLSDIRECTORY/CodeQL"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Gradle JVM settings
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF2

      - name: Install dependencies
        run: bun install 

      - name: Siapkan keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          test -f signing/runnow.jks.enc || { echo "signing/runnow.jks.enc belum ada. Jalankan workflow Buat keystore dulu."; exit 1; }
          test -n "$KS_PASS" || { echo "Secret KEYSTORE_PASSPHRASE kosong"; exit 1; }
          mkdir -p keystore
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KS_PASS -in signing/runnow.jks.enc -out keystore/runnow.jks
          cat > keystore/keystore.properties <<EOF3
          storeFile=$GITHUB_WORKSPACE/keystore/runnow.jks
          storePassword=$KS_PASS
          keyAlias=runnow
          keyPassword=$KS_PASS
          EOF3

      - name: Prebuild Android
        run: |
          export JOYOFIT_VERSION_CODE="$(( ($(date -u +%s) - 1704067200) / 60 ))"
          echo "JOYOFIT_VERSION_CODE=$JOYOFIT_VERSION_CODE" >> "$GITHUB_ENV"
          bunx expo prebuild -p android --no-install

      # Pustaka pihak ketiga (mis. MapLibre) bisa membawa ABI lain. Batasi paket ke arm64-v8a saja.
      - name: Batasi ABI ke arm64
        working-directory: android
        run: |
          if ! grep -q "abiFilters" app/build.gradle; then
            sed -i '0,/defaultConfig {/s//defaultConfig {\n        ndk { abiFilters "arm64-v8a" }/' app/build.gradle
          fi
          grep -n -B1 -A1 "abiFilters" app/build.gradle || echo "PERINGATAN: abiFilters tidak terpasang"

      - name: Cek pengaturan ukuran
        working-directory: android
        run: |
          echo "minify=${{ inputs.minify }} legacy_packaging=${{ inputs.legacy_packaging }}"
          grep -n "enableMinify\|enableShrink\|useLegacyPackaging" app/build.gradle gradle.properties || echo "Tidak ada baris cocok; cek template build.gradle"

      - name: Build APK
        working-directory: android
        run: >
          ./gradlew assembleRelease
          -PreactNativeArchitectures=arm64-v8a
          -Pandroid.enableMinifyInReleaseBuilds=${{ inputs.minify }}
          -Pandroid.enableShrinkResourcesInReleaseBuilds=${{ inputs.minify }}
          -Pexpo.useLegacyPackaging=${{ inputs.legacy_packaging }}

      - name: Isi APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          {
            echo "### Ukuran APK"
            ls -l "$APK" | awk '{printf "File APK: %.1f MB\n", $5/1048576}'
            echo
            echo "Per folder (MB tidak terkompres / terkompres):"
            echo '```'
            unzip -lv "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {split($NF,p,"/"); d=p[1]; if(p[1]=="lib") d=p[1]"/"p[2]; s[d]+=$1; c[d]+=$3} END{for(k in s) printf "%8.1f / %8.1f  %s\n", s[k]/1048576, c[k]/1048576, k}' | sort -rn
            echo '```'
            echo "15 file terbesar:"
            echo '```'
            unzip -lv "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {printf "%8.1f MB  %s\n", $1/1048576, $NF}' | sort -rn | head -15
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Ringkasan
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/runnow-${JOYOFIT_VERSION_CODE}-min${{ inputs.minify }}-leg${{ inputs.legacy_packaging }}.apk"
          ls -la dist
          sha256sum dist/*.apk | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runnow-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
