# Dijalankan sekali dari tab Actions. Membuat keystore Run Now, mengenkripsinya dengan secret KEYSTORE_PASSPHRASE,
# lalu menyimpan hasil enkripsinya di signing/runnow.jks.enc. Tidak pernah menimpa berkas yang sudah ada.
name: Buat keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Berhenti kalau keystore sudah ada
        run: |
          if [ -f signing/runnow.jks.enc ]; then
            echo "signing/runnow.jks.enc sudah ada. Berhenti supaya tidak menimpa."
            exit 1
          fi

      - name: Buat, enkripsi, dan uji
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          test -n "$KS_PASS" || { echo "Secret KEYSTORE_PASSPHRASE kosong"; exit 1; }
          mkdir -p signing
          keytool -genkeypair -keystore runnow.jks -storetype PKCS12 -alias runnow \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Run Now, O=Pribadi, C=ID"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:KS_PASS \
            -in runnow.jks -out signing/runnow.jks.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:KS_PASS \
            -in signing/runnow.jks.enc -out cek.jks
          cmp runnow.jks cek.jks
          keytool -list -keystore cek.jks -storepass "$KS_PASS" | grep -i "runnow"
          rm runnow.jks cek.jks

      - name: Simpan ke repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add signing/runnow.jks.enc
          git commit -m "Tambah keystore Run Now (terenkripsi)"
          git push
